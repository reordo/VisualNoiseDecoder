<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Noise Image</title>
  <style>
    html, body {
      min-width: 100%;
      min-height: 100%;
      margin: 0;
      color-scheme: dark;
      background: #181818;
    }
    #view { display: grid; place-items: center; }
    #view.can-zoom #box { cursor: zoom-in; }
    #view.zoomed #box { cursor: zoom-out; }
    #box { position: relative; overflow: hidden; }
    #stage {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transform-origin: top left;
      image-rendering: pixelated;
      /* Preserve the native-resolution raster prepared before scaling down. */
      will-change: transform;
    }
    .plane {
      position: absolute;
      inset: 0;
      isolation: isolate;
      mix-blend-mode: plus-lighter;
    }
    .layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    .key { mix-blend-mode: difference; }
    #probe { display: none; }
    svg { position: absolute; width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <svg aria-hidden="true">
    <defs>
      <filter id="bit-0" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feComponentTransfer id="transfer-0"/>
      </filter>
      <filter id="bit-1" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feComponentTransfer id="transfer-1"/>
      </filter>
    </defs>
  </svg>

  <div id="view" role="img" aria-label="Decoded image">
    <div id="box">
      <div id="stage"></div>
    </div>
  </div>
  <img id="probe" alt="">

  <script>
    // Fragment: #url=<encoded PNG URL>&seed=<seed phrase>&index=0
    const PLANES = 8;
    const DOMAIN = 'VND-MAIN-HALF-2LSB-MASK-RGB';
    const params = new URLSearchParams(location.hash.slice(1));
    const source = params.get('url');
    const phrase = params.get('seed');
    const index = Number(params.get('index') || 0);
    const stage = document.querySelector('#stage');
    const probe = document.querySelector('#probe');
    const view = document.querySelector('#view');
    const box = document.querySelector('#box');
    let size;
    let zoomed = false;
    let canZoom = false;
    let displayScale = 1;
    let rasterFrame = 0;

    function bit(data, index) {
      return (data[index >> 3] & (1 << (7 - (index & 7)))) !== 0;
    }

    async function keyStream(byteLength) {
      const material = `${DOMAIN}\0${index}\0${phrase}`;
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(material));
      const key = await crypto.subtle.importKey('raw', digest, { name: 'AES-CTR' }, false, ['encrypt']);
      return new Uint8Array(await crypto.subtle.encrypt(
        { name: 'AES-CTR', counter: new Uint8Array(16), length: 128 },
        key,
        new Uint8Array(byteLength)
      ));
    }

    function createFilters() {
      for (const planeBit of [0, 1]) {
        const transfer = document.querySelector(`#transfer-${planeBit}`);
        const values = Array.from({ length: 256 }, (_, value) => (value >> planeBit) & 1).join(' ');

        for (const channel of ['R', 'G', 'B']) {
          const component = document.createElementNS('http://www.w3.org/2000/svg', `feFunc${channel}`);
          component.setAttribute('type', 'discrete');
          component.setAttribute('tableValues', values);
          transfer.append(component);
        }
        const alpha = document.createElementNS('http://www.w3.org/2000/svg', 'feFuncA');
        alpha.setAttribute('type', 'identity');
        transfer.append(alpha);
      }
    }

    function canvasBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => blob ? resolve(blob) : reject(Error('Mask export failed')), 'image/png');
      });
    }

    function waitForImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = resolve;
        image.onerror = reject;
        image.src = url;
      });
    }

    async function createMasks(stream, width, height) {
      const planes = Array.from({ length: PLANES }, () => new ImageData(width, height));
      let streamBit = 0;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const offset = (y * width + x) * 4;
          for (const plane of planes) plane.data[offset + 3] = 255;

          for (let quadrant = 0; quadrant < 4; quadrant++) {
            for (let channel = 0; channel < 3; channel++) {
              for (let planeBit = 0; planeBit < 2; planeBit++) {
                planes[quadrant * 2 + planeBit].data[offset + channel] =
                  bit(stream, streamBit++) ? 255 : 0;
              }
            }
          }
        }
      }

      const urls = [];
      for (let plane = 0; plane < planes.length; plane++) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d', { alpha: false }).putImageData(planes[plane], 0, 0);
        urls.push(URL.createObjectURL(await canvasBlob(canvas)));
        planes[plane] = null;
      }
      return urls;
    }

    function createLayer(className, image, width, height, x = 0, y = 0) {
      const layer = document.createElement('div');
      layer.className = className ? `layer ${className}` : 'layer';
      layer.style.backgroundImage = `url(${JSON.stringify(image)})`;
      layer.style.backgroundSize = `${width}px ${height}px`;
      layer.style.backgroundPosition = `-${x}px -${y}px`;
      return layer;
    }

    function render(maskUrls, sourceWidth, sourceHeight, width, height) {
      const output = document.createDocumentFragment();

      for (let planeIndex = 0; planeIndex < PLANES; planeIndex++) {
        const quadrant = planeIndex >> 1;
        const planeBit = planeIndex & 1;
        const x = (quadrant & 1) * width;
        const y = (quadrant >> 1) * height;
        const plane = document.createElement('div');
        const carrier = createLayer('', probe.src, sourceWidth, sourceHeight, x, y);

        plane.className = 'plane';
        plane.style.opacity = String((1 << planeIndex) / 255);
        carrier.style.filter = `url("#bit-${planeBit}")`;
        plane.append(carrier, createLayer('key', maskUrls[planeIndex], width, height));
        output.append(plane);
      }
      stage.replaceChildren(output);
    }

    function refreshRaster() {
      cancelAnimationFrame(rasterFrame);
      rasterFrame = 0;
      stage.style.transform = `scale(${displayScale})`;
      stage.style.opacity = '';
      if (!size || document.hidden) return;

      let pixelScale = window.devicePixelRatio;
      try {
        for (let viewer = window; viewer.frameElement; viewer = viewer.parent) {
          const frame = viewer.frameElement;
          const bounds = frame.getBoundingClientRect();
          if (!bounds.width || !bounds.height) return;
          // CSS zoom may already be included in the child's devicePixelRatio.
          pixelScale *= Math.min(bounds.width / frame.offsetWidth, bounds.height / frame.offsetHeight) *
            viewer.parent.devicePixelRatio / viewer.devicePixelRatio;
        }
      } catch {
        // Cross-origin embedding only exposes the viewer's own pixel ratio.
      }
      if (displayScale * pixelScale >= 1) return;

      // Rebuild the bit-filter surfaces above native resolution after Chromium discards them.
      // Nonzero opacity keeps rasterization active without showing the enlarged image.
      stage.style.opacity = '0.001';
      stage.style.transform = `scale(${2 / Math.min(1, pixelScale)})`;
      rasterFrame = requestAnimationFrame(() => {
        rasterFrame = requestAnimationFrame(() => {
          stage.style.transform = `scale(${displayScale})`;
          stage.style.opacity = '';
          rasterFrame = 0;
        });
      });
    }

    function layout(notify = true, focus) {
      if (!size) return;

      const root = document.documentElement;
      if (zoomed && !focus && box.offsetWidth && box.offsetHeight) {
        const bounds = box.getBoundingClientRect();
        focus = {
          x: (root.clientWidth / 2 - bounds.left) / bounds.width,
          y: (root.clientHeight / 2 - bounds.top) / bounds.height
        };
      }
      root.style.overflow = 'hidden';
      const fittedScale = Math.min(1, root.clientWidth / size.width, root.clientHeight / size.height);
      canZoom = fittedScale < 1;
      zoomed = zoomed && canZoom;
      root.style.overflow = zoomed ? 'auto' : 'hidden';
      const scale = zoomed ? 1 : fittedScale;
      const width = size.width * scale;
      const height = size.height * scale;

      box.style.width = `${width}px`;
      box.style.height = `${height}px`;
      displayScale = scale;
      refreshRaster();

      // The second pass accounts for any space taken by scrollbars.
      for (let pass = 0; pass < 2; pass++) {
        view.style.width = `${Math.max(root.clientWidth, width)}px`;
        view.style.height = `${Math.max(root.clientHeight, height)}px`;
      }
      // Center the selected image point; scrolling is clamped at the image edges by the browser.
      window.scrollTo(
        zoomed ? (focus?.x ?? 0.5) * width - root.clientWidth / 2 : 0,
        zoomed ? (focus?.y ?? 0.5) * height - root.clientHeight / 2 : 0
      );
      view.classList.toggle('can-zoom', canZoom);
      view.classList.toggle('zoomed', zoomed);
      if (notify && window.parent !== window) {
        window.parent.postMessage({ type: 'vnd-image-size', ...size, canZoom }, '*');
      }
    }

    async function reveal() {
      const sourceWidth = probe.naturalWidth;
      const sourceHeight = probe.naturalHeight;
      const width = Math.floor(sourceWidth / 2);
      const height = Math.floor(sourceHeight / 2);
      if (!width || !height) return;

      const stream = await keyStream(width * height * 3);
      const maskUrls = await createMasks(stream, width, height);
      await Promise.all(maskUrls.map(waitForImage));
      render(maskUrls, sourceWidth, sourceHeight, width, height);

      stage.style.width = `${width}px`;
      stage.style.height = `${height}px`;
      size = { width, height };

      layout();
    }

    createFilters();
    box.addEventListener('click', event => {
      if (canZoom) {
        const bounds = box.getBoundingClientRect();
        const focus = {
          x: (event.clientX - bounds.left) / bounds.width,
          y: (event.clientY - bounds.top) / bounds.height
        };
        zoomed = !zoomed;
        layout(true, focus);
      }
    });
    window.addEventListener('resize', () => layout());
    document.addEventListener('visibilitychange', refreshRaster);
    window.addEventListener('focus', refreshRaster);
    window.addEventListener('pageshow', refreshRaster);
    new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) refreshRaster();
    }).observe(box);

    if (
      source &&
      phrase &&
      Number.isSafeInteger(index) &&
      index >= 0 &&
      crypto?.subtle
    ) {
      // No crossOrigin attribute: the remote carrier must stay usable without CORS.
      probe.addEventListener('load', () => reveal().catch(console.error), { once: true });
      probe.src = source;
    }
  </script>
</body>
</html>
